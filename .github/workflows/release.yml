name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK, CMake and platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.VERTEXA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VERTEXA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VERTEXA_KS_PASS: ${{ secrets.VERTEXA_KS_PASS }}
          VERTEXA_KEY_ALIAS: ${{ secrets.VERTEXA_KEY_ALIAS }}
          VERTEXA_KEY_PASS: ${{ secrets.VERTEXA_KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Prepare release files
        id: prep
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "VertexaPro-ARM-$VERSION.apk"
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "Vertexa Pro $VERSION" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          name: Vertexa Pro ${{ steps.prep.outputs.version }}
          body_path: notes.md
          files: VertexaPro-ARM-${{ steps.prep.outputs.version }}.apk
          make_latest: true
